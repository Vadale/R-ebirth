# Native-workspace and test-tooling checks (no R, no models).
# - cargo:         fmt / clippy / test for the R-free engine crate rebirth-llm,
#                  incl. the --no-default-features (no-spill) config.
#                  (rebirth-ffi needs R, so its tests run in R-CMD-check.yaml.)
#                  R-CMD-check's Linux oldrel leg also builds/tests the full
#                  package with the declared Rust minimum and locked crates.
# - golden:        Harness B numpy reference self-check (the exact-value oracle).
# - vendored-tree: the committed patched llama.cpp tree hashes to VENDORING.md's
#                  post-patch SHA (D-008 gate G4) and patches/*.diff reverse-apply
#                  to the pre-patch SHA (D-015 coherence).
# - supply-chain:  cargo-deny licenses/bans/sources (D-008 gate G4, DETERMINISTIC
#                  half — depends only on the committed Cargo.lock, so it safely gates
#                  PRs). The feed-dependent half (RustSec advisories + cargo audit)
#                  runs in nightly-supply-chain.yaml so a fresh advisory never gates a
#                  PR. Config: rebirth/src/rust/deny.toml.
# - macos-cross-x86: cross-compile + LINK the R-free engine crate's test binaries
#                  for x86_64-apple-darwin on the arm64 runner — the per-commit home
#                  of the shipped Intel-mac r-universe leg (PR #30 bug classes:
#                  wrong-arch vendored objects; missing Accelerate at link).
# All download only pinned tooling; none downloads a model.
on:
  push:
    branches: [main, master]
  pull_request:

name: rust.yaml

permissions: read-all

jobs:
  cargo:
    runs-on: ubuntu-24.04
    name: cargo fmt / clippy / test

    env:
      # D-037 reserves one native execution domain per process. Concurrency
      # regressions spawn their own controlled threads; unrelated tests serialize.
      RUST_TEST_THREADS: "1"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      CMAKE_C_COMPILER_LAUNCHER: "sccache"
      CMAKE_CXX_COMPILER_LAUNCHER: "sccache"

    defaults:
      run:
        working-directory: rebirth/src/rust

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # Required job names remain present for documentation-only changes. Missing
      # or ambiguous history selects full verification; this is not a test pass.
      - name: Classify changed files (fail closed)
        id: scope
        working-directory: .
        run: python3 tests/ci/change_scope.py

      - name: Vision reference manifest corruption controls (no model or native build)
        if: steps.scope.outputs.full_checks != 'false'
        working-directory: .
        run: python3 tests/llm-golden/vision/tools/test_reference_manifest.py

      - name: Graph sizing regression from current source (ASan/UBSan)
        if: steps.scope.outputs.full_checks != 'false'
        working-directory: .
        run: python3 tests/sanitizers/graph_size.py --evidence "$RUNNER_TEMP/graph-size-layout"

      - name: Retain graph sizing regression evidence
        if: always() && steps.scope.outputs.full_checks != 'false'
        uses: actions/upload-artifact@v7
        with:
          name: graph-size-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/graph-size-layout
          if-no-files-found: warn

      - uses: dtolnay/rust-toolchain@stable
        if: steps.scope.outputs.full_checks != 'false'
        with:
          components: rustfmt, clippy

      # Cache the vendored llama.cpp (cmake C++) + Rust compilation across runs,
      # keyed by content hash. RUSTC_WRAPPER + CMAKE_*_COMPILER_LAUNCHER (see env)
      # route rustc and the engine's cmake build through sccache; the GHA backend
      # stores the cache. The dominant CI cost is recompiling llama.cpp each run.
      - name: sccache (compiler cache)
        if: steps.scope.outputs.full_checks != 'false'
        uses: mozilla-actions/sccache-action@v0.0.10

      # rebirth-ffi is the extendr boundary crate: building it requires R (the
      # extendr-ffi build script locates R). This R-free job therefore builds,
      # tests, and lints only rebirth-llm — which proves the engine crate stays
      # R-free and independently testable (ARCHITECTURE.md §2). rebirth-ffi is
      # compiled and validated by the R-CMD-check workflow (which sets up R);
      # that workflow also lints the boundary crate with R available.
      - name: cargo fmt --check (whole workspace)
        if: steps.scope.outputs.full_checks != 'false'
        run: |
          cargo fmt --all --check
          # include! keeps extendr registration in one module; rustfmt does not
          # follow include files automatically.
          rustfmt --check --edition 2021 rebirth-ffi/src/async_boundary.rs

      - name: cargo clippy (R-free engine crate; deny warnings)
        if: steps.scope.outputs.full_checks != 'false'
        run: cargo clippy --locked -p rebirth-llm --all-targets -- -D warnings

      # Includes the exact-value engine-vs-oracle logit check (WP2 Step 1,
      # tests/synthetic_logits.rs): the built engine's teacher-forced logits on
      # the committed synthetic GGUF must match the numpy oracle golden within
      # the documented F32-vs-F64 tolerance. Download-free, synthetic-only.
      - name: cargo test (R-free engine crate)
        id: engine_tests
        if: steps.scope.outputs.full_checks != 'false'
        run: cargo test --locked -p rebirth-llm

      # This new controlled observation runs only after an engine test failure.
      # It does not replace, relax, retry or turn that failed test green.
      - name: Retain output-policy failure diagnosis
        if: failure() && steps.engine_tests.outcome == 'failure'
        run: |
          mkdir -p "$RUNNER_TEMP/projection-policy-diagnosis"
          git rev-parse HEAD > "$RUNNER_TEMP/projection-policy-diagnosis/source-sha.txt"
          cargo test --locked -p rebirth-llm --lib projection::tests::projection_output_policy_failure_diagnostic -- --exact --ignored --nocapture > "$RUNNER_TEMP/projection-policy-diagnosis/native.log" 2>&1

      - name: Upload output-policy failure observations
        if: failure() && steps.engine_tests.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: projection-policy-diagnosis-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/projection-policy-diagnosis
          if-no-files-found: error

      # Ownership assertions must remain active in optimized builds (D-037).
      - name: async ownership and cancellation (release profile)
        if: steps.scope.outputs.full_checks != 'false'
        run: cargo test --locked --release -p rebirth-llm --lib async

      - name: async synthetic handoff golden (release profile)
        if: steps.scope.outputs.full_checks != 'false'
        run: cargo test --locked --release -p rebirth-llm --test async_synthetic

      # The no-spill configuration (--no-default-features drops the `spill` feature
      # in both crates, D-013) must stay compilable and green: its
      # #[cfg(not(feature = "spill"))] arm has no other CI coverage and would
      # otherwise rot. Build + test (not just check) -- the spill-only tests are
      # #![cfg(feature = "spill")]-gated, so they compile out here.
      - name: cargo test (R-free engine crate, no-spill config)
        if: steps.scope.outputs.full_checks != 'false'
        run: cargo test --locked -p rebirth-llm --no-default-features

  # Harness B, part (b): the numpy reference oracle must be deterministic and
  # still agree with the committed logit goldens and the committed synthetic
  # GGUF. Part (a) — the GGUF loads via relm::llm() with the right dims — runs
  # in R-CMD-check.yaml via tests/testthat/test-llm-synthetic.R. This job installs
  # only the pinned golden tooling (numpy + gguf); it downloads no model.
  golden:
    runs-on: ubuntu-24.04
    name: harness B golden self-check

    steps:
      - uses: actions/checkout@v7

      - name: CI change routing controls (no dependencies or models)
        run: python3 tests/ci/test_change_scope.py

      - uses: actions/setup-python@v7
        with:
          # Exact interpreter recorded by the independent D045/D046 references.
          python-version: '3.13.5'

      - name: install pinned golden tooling (test-only, not a package dep)
        run: pip install -r tests/llm-golden/requirements.txt

      - name: reference forward self-check (determinism + goldens + GGUF)
        run: python tests/llm-golden/synthetic/reference_forward.py --check

      - name: Probe statistical reference artifact check (no model)
        run: python tests/llm-golden/probe-contract/reference.py --check

      - name: Contrast-direction arithmetic and canonical reference (no model)
        run: |
          python tests/llm-golden/directions/reference_directions.py --check
          python tests/directions/check-fixture-mirror.py

      - name: Projection arithmetic, forward and schema-2 references (no engine)
        id: projection_reference
        run: |
          python tests/projection/test_reference_retention.py
          python tests/projection/test_reference_comparison.py
          python tests/projection/check_reference_retained.py --output "$RUNNER_TEMP/projection-reference-check"
          python tests/projection/test_fixture_mirror.py
          python tests/projection/check-fixture-mirror.py

      - name: Retain strict projection reference failure bytes
        if: failure() && steps.projection_reference.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: projection-reference-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/projection-reference-check
          if-no-files-found: warn

      - name: Service contract consistency (planning only)
        run: python tests/service-contract/verify.py --self-test

      - name: Structured-output offline contract checks (no model)
        run: |
          python tests/structured-output/verify.py --self-test
          python tests/structured-output/check_batch_contract.py
          python tests/structured-output/run-model.py --self-test
          python tests/structured-output/test-evaluate-model.py
          python tests/structured-output/check-evaluation-artifacts.py

  # D-008 gate G4 + D-015 patch coherence: prove the committed, patched vendored
  # llama.cpp tree still hashes to the recorded post-patch SHA256 (a silent engine
  # change fails here) and that patches/*.diff reverse-apply to the pre-patch
  # SHA256 (the committed tree and the diff cannot drift apart). No Rust, no model.
  vendored-tree:
    runs-on: ubuntu-24.04
    name: vendored tree integrity (G4 + patch coherence)

    steps:
      - uses: actions/checkout@v7

      - name: verify vendored llama.cpp tree SHA256 + patch coherence
        run: sh rebirth/src/llama.cpp/patches/verify_vendored_tree.sh

  # D-008 gate G4 (deterministic half): the dependency tree carries only permitted
  # licenses (MIT / Apache-2.0 / Unicode-3.0, + tiny-keccak's CC0-1.0 exception), no
  # banned crate, and no unexpected source. These checks read only the committed
  # Cargo.lock + Cargo.toml, so they are reproducible run-to-run and safely gate a PR
  # (a new dependency with a bad license is caught before merge). RustSec ADVISORIES
  # are intentionally NOT here — they change with the external feed, so they run in
  # nightly-supply-chain.yaml (never gating a PR). No Rust build; no model.
  supply-chain:
    runs-on: ubuntu-24.04
    name: supply-chain (cargo-deny licenses/bans/sources)

    steps:
      - uses: actions/checkout@v7

      # Install a PREBUILT cargo-deny binary (~seconds) instead of the Docker-based
      # cargo-deny-action, whose image build cost ~10 min/run while the check itself is
      # ~15s. Keeps the per-PR gate fast (the point of the sccache CI cache).
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: cargo deny — licenses / bans / sources
        working-directory: rebirth/src/rust
        run: cargo-deny check bans licenses sources

  # WP-V1 reviewer finding: the macOS x86_64 (Intel) engine build is a shipped
  # r-universe artifact, but no per-commit job exercised that leg — a regression
  # (the PR #30 class: wrong-arch vendored objects, or a framework missing from
  # the x86_64 link) would surface only post-merge on the r-universe rebuild.
  # This job cross-compiles the R-free engine crate and LINKS its test binaries
  # (--no-run) for x86_64-apple-darwin on the arm64 runner; the link step is the
  # gate. Tests are not executed (cross arch); no R, no model.
  macos-cross-x86:
    runs-on: macos-15
    name: macOS x86_64 cross engine link

    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      CMAKE_C_COMPILER_LAUNCHER: "sccache"
      CMAKE_CXX_COMPILER_LAUNCHER: "sccache"

    defaults:
      run:
        working-directory: rebirth/src/rust

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # Required job names remain present for documentation-only changes. Missing
      # or ambiguous history selects full verification; this is not a test pass.
      - name: Classify changed files (fail closed)
        id: scope
        working-directory: .
        run: python3 tests/ci/change_scope.py

      - uses: dtolnay/rust-toolchain@stable
        if: steps.scope.outputs.full_checks != 'false'
        with:
          targets: x86_64-apple-darwin

      - name: Graph sizing regression on the native Mac host (ASan/UBSan)
        if: steps.scope.outputs.full_checks != 'false'
        working-directory: .
        run: python3 tests/sanitizers/graph_size.py --evidence "$RUNNER_TEMP/graph-size-layout"

      - name: Retain native Mac graph sizing evidence
        if: always() && steps.scope.outputs.full_checks != 'false'
        uses: actions/upload-artifact@v7
        with:
          name: graph-size-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/graph-size-layout
          if-no-files-found: warn

      - name: sccache (compiler cache)
        if: steps.scope.outputs.full_checks != 'false'
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: cargo test --no-run for x86_64-apple-darwin (link is the gate)
        if: steps.scope.outputs.full_checks != 'false'
        run: cargo test --locked -p rebirth-llm --no-run --target x86_64-apple-darwin
