name: CRAN portability

on:
  pull_request:
  push:
    branches: [main, master]

permissions: read-all

jobs:
  windows-cpu:
    name: Windows CPU source package (R release)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      RELM_ENABLE_CUDA: "0"
      RELM_ENABLE_SELFTESTS: "0"
      RUST_TEST_THREADS: "1"
      CARGO_BUILD_JOBS: "2"
      CARGO_NET_OFFLINE: "true"
      NOT_CRAN: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify source bundles without compilation
        shell: bash
        run: python tools/prepare-cran-sources.py --check
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: x86_64-pc-windows-gnu
      - name: Native path and link controls (no engine build)
        shell: pwsh
        run: |
          rustc --edition=2021 --test -D warnings rebirth/src/rust/rebirth-llm/build_support.rs -o "$env:RUNNER_TEMP/native-build-controls.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/native-build-controls.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
          working-directory: rebirth
      - name: Configure and source extraction controls
        shell: Rscript {0}
        run: source("tests/cran/configuration.R")
      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: rebirth
          args: 'c("--as-cran", "--no-manual")'
          error-on: '"warning"'
          upload-snapshots: true
      - name: Retain Windows package results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-cpu-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            rebirth/check
            rebirth/*.tar.gz
          if-no-files-found: warn
