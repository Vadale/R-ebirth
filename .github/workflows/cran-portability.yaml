name: CRAN portability

on:
  pull_request:
  push:
    branches: [main, master]

permissions: read-all

# Windows ARM64 and WebAssembly are deferred by the founder (D-057).
# Their former jobs and exact toolchain are retained in Git; see docs/ci-efficiency-implementation.md.
jobs:
  windows-cpu:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows CPU source package (R release)
            runner: windows-latest
            target: x86_64-pc-windows-gnu
            compiler: gcc
            artifact: windows-cpu-package
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      RELM_ENABLE_CUDA: "0"
      RELM_ENABLE_SELFTESTS: "0"
      RUST_TEST_THREADS: "1"
      CARGO_BUILD_JOBS: "2"
      CARGO_NET_OFFLINE: "true"
      NOT_CRAN: "false"
      _R_CHECK_LIMIT_CORES_: "true"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      BLIS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify source bundles without compilation
        shell: bash
        run: python tools/prepare-cran-sources.py --check
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Native path and link controls (no engine build)
        shell: pwsh
        run: |
          rustc --edition=2021 --test -D warnings rebirth/src/rust/rebirth-llm/build_support.rs -o "$env:RUNNER_TEMP/native-build-controls.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/native-build-controls.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Live file ownership controls (no engine build)
        shell: pwsh
        run: |
          rustc --edition=2021 --test -D warnings rebirth/src/rust/rebirth-llm/src/live_file.rs -o "$env:RUNNER_TEMP/live-file-controls.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/live-file-controls.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
          working-directory: rebirth
      - name: Configure and source extraction controls
        shell: Rscript {0}
        run: |
          source("tests/cran/configuration.R")
          source("tests/cran/native-build.R")
          source("tests/toolchain/test-msrv.R")
      - name: Rtools thread declaration compatibility (no engine build)
        shell: bash
        run: python tests/cran/windows_thread_compat.py --compiler "${{ matrix.compiler }}" --output "$RUNNER_TEMP/windows-thread-compat"
      - name: R-hosted wrapper generator controls (no engine build)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/wrapper-controls"
          Rscript --vanilla tests/cran/wrapper-generator.R "$RUNNER_TEMP/wrapper-controls"
      - name: Quarto temporary-library and extracted-script controls (no native build)
        shell: Rscript {0}
        run: |
          args <- c(Sys.getenv("RUNNER_TEMP"), "--quarto")
          commandArgs <- function(trailingOnly = FALSE) args
          source("tests/cran/vignette-library.R")
      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: rebirth
          args: 'c("--as-cran", "--no-manual")'
          error-on: '"warning"'
          upload-snapshots: true
      - name: Require completed R CMD check
        run: Rscript --vanilla tests/ci/check-r-complete.R rebirth/check/relm.Rcheck/00check.log
      - name: Retain Windows package results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            rebirth/check
            rebirth/*.tar.gz
            ${{ runner.temp }}/windows-thread-compat/receipt.json
            ${{ runner.temp }}/vignette-library
            ${{ runner.temp }}/wrapper-controls
          if-no-files-found: warn

  r-devel:
    name: Linux production source package (R-devel, PDF manual)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      RELM_ENABLE_CUDA: "0"
      RELM_ENABLE_SELFTESTS: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_NET_OFFLINE: "true"
      NOT_CRAN: "false"
      _R_CHECK_LIMIT_CORES_: "true"
      _R_CHECK_FORCE_SUGGESTS_: "true"
      _R_CHECK_CRAN_INCOMING_: "true"
      _R_CHECK_CRAN_INCOMING_REMOTE_: "true"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      BLIS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify source bundles and installed notices
        run: python tools/prepare-cran-sources.py --check
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: devel
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-tinytex@v2
        env:
          TINYTEX_INSTALLER: TinyTeX
      - name: Install HTML checking tool
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tidy
          tidy --version
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
          working-directory: rebirth
      - name: Configure controls before native compilation
        run: |
          Rscript --vanilla tests/cran/configuration.R
          Rscript --vanilla tests/cran/native-build.R
          mkdir -p "$RUNNER_TEMP/wrapper-controls"
          Rscript --vanilla tests/cran/wrapper-generator.R "$RUNNER_TEMP/wrapper-controls"
          Rscript --vanilla tests/toolchain/test-msrv.R
          rustc --edition=2021 --test -D warnings rebirth/src/rust/rebirth-llm/src/live_file.rs -o "$RUNNER_TEMP/live-file-controls"
          "$RUNNER_TEMP/live-file-controls"
      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: rebirth
          args: 'c("--as-cran")'
          build_args: 'character()'
          error-on: '"warning"'
      - name: Require completed R CMD check
        run: Rscript --vanilla tests/ci/check-r-complete.R rebirth/check/relm.Rcheck/00check.log
      - name: Retain R-devel source, manual and results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: r-devel-cran-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            rebirth/check
            rebirth/*.tar.gz
            ${{ runner.temp }}/wrapper-controls
          if-no-files-found: warn

  nonshared-r:
    name: Linux CPU installation (R without shared library)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: '1.85.0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.85.0'
      - name: Install isolated-R build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gfortran libreadline-dev libpcre2-dev libcurl4-openssl-dev libbz2-dev liblzma-dev libdeflate-dev libzstd-dev zlib1g-dev texinfo cmake curl
      - name: Pinned prerequisite download controls (no network)
        run: python tests/cran/test-nonshared-downloads.py
      - name: Actual non-shared R and production installation (no models)
        run: python tests/cran/nonshared-r.py "$RUNNER_TEMP/nonshared-r"
      - name: Retain non-shared R installation results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nonshared-r-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/nonshared-r/*.log
            ${{ runner.temp }}/nonshared-r/*.json
            ${{ runner.temp }}/nonshared-r/*.rds
            ${{ runner.temp }}/nonshared-r/r-build/config.log
            ${{ runner.temp }}/nonshared-r/library/relm
          if-no-files-found: warn
