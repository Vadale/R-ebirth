url: https://vadale.github.io/R-ebirth/
development:
  mode: unreleased
repo:
  url:
    home: https://github.com/Vadale/R-ebirth/
    source: https://github.com/Vadale/R-ebirth/blob/HEAD/rebirth/
    issue: https://github.com/Vadale/R-ebirth/issues/
    user: https://github.com/

template:
  bootstrap: 5

reference:
- title: Models
  desc: Load a local model, then inspect, summarize, or tokenize it.
  contents:
  - llm
  - summary.llm
  - close.llm
  - llm_tokens
- title: Generation
  desc: Produce text and read the model's next-token distribution.
  contents:
  - llm_generate
  - llm_cancel
  - llm_logits
- title: Embeddings
  desc: Encode text into a numeric matrix.
  contents:
  - llm_embed
- title: Interpretability
  desc: Observe the model's internals and intervene on them.
  contents:
  - llm_trace
  - as.matrix.relm_trace
  - llm_direction
  - llm_apply_direction
  - llm_compare
  - llm_timeline
  - plot.llm
  - plot.relm_timeline
  - llm_steer
  - llm_ablate
- title: Statistical probes
  desc: Grouped binary ridge probes, held-out evaluation, and conditional intervals.
  contents:
  - activations
  - llm_probe
  - probe-methods
  - predict.llm_probe
- title: Models on disk
  desc: Fetch pinned, checksum-verified models.
  contents:
  - llm_download

articles:
- title: Worked demos
  navbar: Demos
  contents:
  - anatomy-lab
  - topics-without-python
  - vision
  - token-streaming
  - contrast-directions
  - model-interventions
